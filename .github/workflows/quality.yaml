name: Check Code Quality
on:
    - push
    - pull_request
    - workflow_dispatch
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: npm
            - run: npm ci
            - run: npm test
